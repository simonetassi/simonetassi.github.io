<script>
const timezone = "Europe/Rome";
const city = "Bologna";

document.addEventListener("DOMContentLoaded", function() {
  function updateClock() {
    const options = { 
      timeZone: timezone,
      hour: '2-digit', 
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    };
    
    const time = new Date().toLocaleTimeString('it-IT', options);
    document.getElementById('clock').textContent = `${city}, ${time}`;
    
    // Update every second
    setTimeout(updateClock, 1000);
  }
  
  updateClock();

  const themes = ["system", "light", "dark"];
  const toggle = document.getElementById("theme-toggle");

  function showTheme(theme) {
    toggle.setAttribute("aria-label", `theme: ${theme}, click to change`);
    toggle.title = `theme: ${theme}`;
  }

  showTheme(document.documentElement.dataset.theme || "system");

  toggle.addEventListener("click", function() {
    const current = document.documentElement.dataset.theme || "system";
    const next = themes[(themes.indexOf(current) + 1) % themes.length];

    if (next === "system") {
      delete document.documentElement.dataset.theme;
    } else {
      document.documentElement.dataset.theme = next;
    }
    try {
      if (next === "system") localStorage.removeItem("theme");
      else localStorage.setItem("theme", next);
    } catch (e) {}

    showTheme(next);
  });
});
</script>

# The URL the site will be built for
base_url = "https://simonetassi.github.io"
title = "simonetassi"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown.highlighting]
theme = "gruvbox-dark-soft"
style = "class"
error_on_missing_language = true

[extra]
# Put all your custom variables here
menu = [
    { name = "about", url = "/about", weigtht = 1 },
    { name = "blog", url = "/blog", weight = 2 },
    { name = "projects", url = "/projects", weight = 3 },
]

socials = [
#    { name = "github", url = "https://github.com/simonetassi/", icon = "github" },
]

[extra.clock]
timezone = 'Europe/Rome'
city = 'Bologna'

